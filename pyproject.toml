[project]
name = "fraud-scorer"
version = "0.1.0"
description = "Agentic AI Transaction Fraud Scorer using Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Abhishek Biswas" }
]
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0.0",
]
anthropic = [
    "anthropic>=0.30.0",
]
all = [
    "google-genai>=1.0.0",
    "anthropic>=0.30.0",
]

[project.scripts]
fraud-mcp-server = "fraud_scorer.mcp.server:main"
fraud-scorer-agent = "fraud_scorer.agent.orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
